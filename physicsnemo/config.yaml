scheduler:
  lr: 1.E-3
  lr_decay: 1.E-3

training:
  batch_size: 100
  epochs: 100
  geometries: "healthy"
  stride: 5
  rate_noise: 100
  train_test_split: 0.9
  loss_weight_1st_timestep: 1
  loss_weight_other_timesteps: 0.5
  loss_weight_boundary_nodes: 100

checkpoints:
  ckpt_path: "checkpoints"
  ckpt_name: "model.pt"

performance:
  amp: False
  jit: False

testing:
  graph: "s0090_0001.21.0.grph"

architecture:
  processor_size: 5
  hidden_dim_node_encoder: 64
  hidden_dim_edge_encoder: 64
  hidden_dim_processor: 64
  hidden_dim_node_decoder: 64

paths:
  data_dir: /global/cfs/projectdirs/trn007/lbl_atlas/data/stats_100K
  save_dir: /global/cfs/projectdirs/trn007/lbl_atlas/data/physicsnemo_graphs/stats_100K

datasets:
  - name: ttH_cp_even
    load_path: ${paths.data_dir}/ttH_NLO.root
    save_path: ${paths.save_dir}/ttH_NLO_processed.pt
    label: 0
  - name: ttH_cp_odd
    load_path: ${paths.data_dir}/ttH_CPodd.root
    save_path: ${paths.save_dir}/ttH_CPodd.pt
    label: 1

root_graph:
  ttree: output
  type: torch.bfloat16
  particles: ["jet", "ele", "mu", "ph", "MET"]
  features: ["pt", "eta", "phi", "energy", "btag", "charge", "node_type"]
  globals: []
  weights: ""
  batch_size: 4096